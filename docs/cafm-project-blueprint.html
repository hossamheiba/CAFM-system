<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAFM Platform — Project Blueprint &amp; Implementation Roadmap</title>
<meta name="description" content="Bilingual (Arabic/English) project blueprint and implementation reference for a Computer-Aided Facility Management (CAFM) platform. Draft for stakeholder review.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
/* =====================================================================
   CAFM Project Blueprint — styles
   Light theme only. Colours are tokens; components use logical
   properties so the layout mirrors correctly for Arabic (RTL).
   ===================================================================== */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #f0f3f7;
  --surface-3: #e7ecf2;
  --ink: #0f1c2e;
  --ink-2: #2c3b50;
  --muted: #586a80;
  --faint: #8695a8;
  --line: #dde4ec;
  --line-2: #c9d3df;

  --blue: #1b4f8c;
  --blue-600: #2160a8;
  --blue-50: #eef4fb;
  --blue-100: #d6e4f4;
  --navy: #14325a;
  --teal: #0b6f67;
  --teal-50: #e7f4f2;
  --teal-100: #c6e6e1;
  --green: #2c7549;
  --green-50: #ebf5ee;
  --green-100: #cde6d5;
  --amber: #9a5600;
  --amber-50: #fcf3e3;
  --amber-100: #f1dbb2;
  --red: #a8322b;
  --red-50: #fbedec;
  --red-100: #f0cdca;
  --violet: #574a9e;
  --violet-50: #f1effa;
  --violet-100: #dcd7f0;
  --slate: #4b5a6d;
  --slate-50: #eef1f5;
  --slate-100: #d8dfe8;
  --focus: #1d63c9;

  --radius: 10px;
  --radius-sm: 6px;
  --shadow-sm: 0 1px 2px rgba(15, 28, 46, .05);
  --shadow: 0 1px 2px rgba(15, 28, 46, .05), 0 6px 20px rgba(15, 28, 46, .06);
  --topbar-h: 60px;
  --font-en: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-ar: "IBM Plex Sans Arabic", "Segoe UI", "Geeza Pro", "Noto Sans Arabic", Tahoma, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: calc(var(--topbar-h) + 20px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-en); font-size: 16px; line-height: 1.65;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
html[lang="ar"] body { font-family: var(--font-ar); line-height: 1.85; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
img, svg { max-width: 100%; }
a { color: var(--blue-600); text-underline-offset: 3px; }
a:hover { color: var(--navy); }
p { margin: 0 0 12px; }
h1, h2, h3, h4 { color: var(--ink); }
code, .code { font-family: var(--font-mono); font-size: .88em; }
code { background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; direction: ltr; unicode-bidi: isolate; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.print-only { display: none; }

/* ---------- Icons ---------- */
.ic { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: middle; }
.ic-sm { width: 15px; height: 15px; }
.ic-lg { width: 22px; height: 22px; }
[dir="rtl"] .ic.flip { transform: scaleX(-1); }

/* ---------- Skip link ---------- */
.skip-link { position: absolute; inset-inline-start: 12px; top: -60px; z-index: 100; background: var(--blue); color: #fff; padding: 10px 14px; border-radius: 8px; text-decoration: none; font-weight: 600; }
.skip-link:focus { top: 10px; color: #fff; }

/* ---------- Top bar ---------- */
.topbar { position: sticky; top: 0; z-index: 50; height: var(--topbar-h); background: rgba(255, 255, 255, .94); border-bottom: 1px solid var(--line); }
@supports (backdrop-filter: blur(4px)) { .topbar { background: rgba(255, 255, 255, .86); backdrop-filter: saturate(1.4) blur(10px); } }
.topbar-inner { max-width: 1480px; margin: 0 auto; height: 100%; display: flex; align-items: center; gap: 14px; padding: 0 24px; }
.brand { display: flex; align-items: center; gap: 11px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand:hover { color: var(--ink); }
.brand-mark { width: 32px; height: 32px; border-radius: 8px; background: var(--blue); display: grid; place-items: center; color: #fff; flex: none; }
.brand-mark .ic { width: 18px; height: 18px; }
.brand-text { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.brand-text strong { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-text small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-status { display: inline-flex; }
.top-actions { margin-inline-start: auto; display: flex; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); border-radius: 8px; padding: 7px 12px; font-size: 14px; line-height: 1.2; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--blue-600); color: var(--blue); }
.btn-ghost { background: transparent; }
.btn-menu { display: none; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-2); border-radius: 9px; padding: 2px; background: var(--surface-2); gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 11px; border-radius: 7px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; line-height: 1.2; }
.seg button:hover { color: var(--blue); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--blue); box-shadow: 0 1px 2px rgba(15, 28, 46, .12); font-weight: 600; }
.top-actions .seg { flex-wrap: nowrap; }
.seg button[lang="ar"] { font-family: var(--font-ar); }
.seg button[lang="en"] { font-family: var(--font-en); }
.progress { position: fixed; top: var(--topbar-h); inset-inline: 0; height: 3px; z-index: 49; pointer-events: none; }
.progress span { display: block; height: 100%; width: 0; background: var(--teal); }

/* ---------- Layout ---------- */
.layout { max-width: 1480px; margin: 0 auto; display: grid; grid-template-columns: 264px minmax(0, 1fr); }
.sidenav { position: sticky; top: calc(var(--topbar-h) + 3px); align-self: start; height: calc(100vh - var(--topbar-h) - 3px); overflow-y: auto; padding: 26px 14px 32px 22px; border-inline-end: 1px solid var(--line); }
[dir="rtl"] .sidenav { padding: 26px 22px 32px 14px; }
.nav-title { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; padding-inline-start: 10px; }
html[lang="ar"] .nav-title { letter-spacing: 0; font-size: 13px; }
.nav-list { list-style: none; margin: 0; padding: 0; }
.nav-list a { display: flex; gap: 10px; align-items: flex-start; padding: 7px 10px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-size: 14px; line-height: 1.4; border-inline-start: 2px solid transparent; }
.nav-list a:hover { background: var(--surface-2); color: var(--ink); }
.nav-list a[aria-current="true"] { background: var(--blue-50); color: var(--blue); font-weight: 600; border-inline-start-color: var(--blue); border-radius: 0 8px 8px 0; }
[dir="rtl"] .nav-list a[aria-current="true"] { border-radius: 8px 0 0 8px; }
.nav-letter { flex: none; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: var(--surface-3); color: var(--ink-2); font-family: var(--font-en); }
.nav-list a[aria-current="true"] .nav-letter { background: var(--blue); color: #fff; }
.nav-meta { margin: 18px 10px 0; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.nav-meta .bar { height: 4px; border-radius: 4px; background: var(--surface-3); margin-top: 8px; overflow: hidden; }
.nav-meta .bar span { display: block; height: 100%; background: var(--teal); width: 0; }
.scrim { display: none; }
main { padding: 30px 40px 72px; min-width: 0; }
.wrap { max-width: 1160px; margin: 0 auto; }

/* ---------- Cover ---------- */
.cover { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 36px 40px 32px; position: relative; overflow: hidden; }
.cover::before { content: ""; position: absolute; inset-inline: 0; top: 0; height: 4px; background: linear-gradient(90deg, var(--blue), var(--teal)); }
[dir="rtl"] .cover::before { background: linear-gradient(270deg, var(--blue), var(--teal)); }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--teal); margin: 0 0 14px; }
html[lang="ar"] .eyebrow { letter-spacing: 0; font-size: 14px; }
.cover h1 { font-size: clamp(26px, 3vw, 36px); line-height: 1.2; letter-spacing: -.015em; margin: 0 0 12px; font-weight: 600; max-width: 900px; }
html[lang="ar"] .cover h1 { letter-spacing: 0; line-height: 1.45; }
.cover-sub { font-size: 18px; color: var(--ink-2); max-width: 820px; margin: 0 0 22px; }
.cover-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; margin-top: 26px; }
.meta-list { display: grid; grid-template-columns: max-content 1fr; gap: 9px 18px; margin: 0; font-size: 14.5px; }
.meta-list dt { color: var(--muted); }
.meta-list dd { margin: 0; color: var(--ink); font-weight: 500; }
.legend-box { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; background: var(--surface-2); }
.legend-box h2 { font-size: 14px; margin: 0 0 10px; font-weight: 600; }
.legend-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13.5px; color: var(--ink-2); }
.legend-list li { display: grid; grid-template-columns: 150px 1fr; gap: 10px; align-items: start; }
html[lang="ar"] .legend-list li { grid-template-columns: 140px 1fr; }
.glance { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; margin-top: 26px; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.glance div { padding: 14px 16px; border-inline-end: 1px solid var(--line); background: var(--surface); }
.glance div:last-child { border-inline-end: 0; }
.glance strong { display: block; font-size: 26px; font-weight: 600; color: var(--navy); line-height: 1.15; font-family: var(--font-en); }
.glance span { display: block; font-size: 13px; color: var(--ink-2); font-weight: 500; }
.glance small { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.glance-cap { font-size: 12.5px; color: var(--muted); margin: 8px 2px 0; }

/* ---------- Sections ---------- */
.doc-section { padding-top: 64px; }
.sec-head { max-width: 860px; margin-bottom: 26px; padding-top: 22px; border-top: 1px solid var(--line-2); }
.sec-kicker { display: flex; align-items: center; gap: 10px; font-size: 12.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--blue); }
html[lang="ar"] .sec-kicker { letter-spacing: 0; font-size: 14px; }
.sec-letter { width: 28px; height: 28px; border-radius: 7px; background: var(--blue); color: #fff; display: grid; place-items: center; font-size: 14px; letter-spacing: 0; font-family: var(--font-en); }
.sec-head h2 { font-size: clamp(24px, 2.3vw, 30px); line-height: 1.25; margin: 12px 0 8px; font-weight: 600; letter-spacing: -.01em; }
html[lang="ar"] .sec-head h2 { letter-spacing: 0; line-height: 1.5; }
.sec-lede { color: var(--ink-2); font-size: 17px; margin: 0; }
.sub { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 600; margin: 40px 0 14px; line-height: 1.35; }
.sub .ic { color: var(--teal); }
.sub-note { margin: -6px 0 14px; color: var(--muted); font-size: 14.5px; max-width: 860px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 20px 22px; }
.card > :last-child { margin-bottom: 0; }
.card-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-size: 16.5px; font-weight: 600; margin: 0 0 10px; line-height: 1.4; }
.card-h .ic { color: var(--blue); }
.card h4, .h4 { font-size: 15px; font-weight: 600; margin: 0 0 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; line-height: 1.4; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.stack-gap > * + * { margin-top: 16px; }
.note { display: flex; gap: 10px; align-items: flex-start; color: var(--muted); font-size: 14.5px; margin: 12px 0 0; max-width: 900px; }
.note .ic { margin-top: 3px; color: var(--faint); }

/* ---------- Tags ---------- */
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; line-height: 1.2; padding: 4px 9px 4px 8px; border-radius: 999px; border: 1px solid; white-space: nowrap; letter-spacing: 0; text-transform: none; vertical-align: middle; }
html[lang="ar"] .tag { font-size: 12.5px; padding: 3px 9px; }
.tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.tag-confirmed, .tag-approved, .tag-brief { color: var(--green); background: var(--green-50); border-color: var(--green-100); }
.tag-recommended, .tag-proposed { color: var(--blue); background: var(--blue-50); border-color: var(--blue-100); }
.tag-pending, .tag-open, .tag-confirm { color: var(--amber); background: var(--amber-50); border-color: var(--amber-100); }
.tag-optional { color: var(--violet); background: var(--violet-50); border-color: var(--violet-100); }
.tag-future { color: var(--slate); background: var(--slate-50); border-color: var(--slate-100); }
.tag-assumption, .tag-distinct { color: var(--teal); background: var(--teal-50); border-color: var(--teal-100); }
.tag-rejected { color: var(--red); background: var(--red-50); border-color: var(--red-100); }
.tag-core { color: var(--ink-2); background: var(--surface-2); border-color: var(--line-2); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; line-height: 1.3; padding: 3px 9px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
html[lang="ar"] .chip { font-size: 13px; }
a.chip, button.chip { cursor: pointer; text-decoration: none; }
a.chip:hover, button.chip:hover { border-color: var(--blue-600); color: var(--blue); background: var(--blue-50); }
.chip-role { background: var(--teal-50); border-color: var(--teal-100); color: var(--teal); }
.chip-code { font-family: var(--font-mono); font-size: 12px; direction: ltr; }
.chip-phase { background: var(--blue-50); border-color: var(--blue-100); color: var(--blue); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- Lists ---------- */
ul.list, ol.list { margin: 0; padding: 0; list-style: none; }
ul.list > li { position: relative; padding-inline-start: 18px; margin: 7px 0; }
ul.list > li::before { content: ""; position: absolute; inset-inline-start: 2px; top: .68em; width: 6px; height: 6px; border-radius: 2px; background: var(--teal); }
html[lang="ar"] ul.list > li::before { top: .8em; }
ul.list.checks > li { padding-inline-start: 24px; }
ul.list.checks > li::before { width: 10px; height: 5px; border-radius: 0; background: none; border-left: 2px solid var(--green); border-bottom: 2px solid var(--green); transform: rotate(-45deg); top: .55em; }
ul.list.xs > li::before { background: var(--line-2); }
ul.list.dense > li { margin: 4px 0; font-size: 14.5px; }
ol.num { counter-reset: n; margin: 0; padding: 0; list-style: none; }
ol.num > li { counter-increment: n; position: relative; padding-inline-start: 34px; margin: 10px 0; }
ol.num > li::before { content: counter(n); position: absolute; inset-inline-start: 0; top: 1px; width: 24px; height: 24px; border-radius: 50%; background: var(--blue-50); color: var(--blue); font-size: 12.5px; font-weight: 600; display: grid; place-items: center; font-family: var(--font-en); }
.field-list { font-size: 14.5px; }

/* ---------- Callouts ---------- */
.callout { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--radius); border: 1px solid var(--blue-100); background: var(--blue-50); color: var(--ink-2); font-size: 15px; }
.callout > .ic { color: var(--blue); margin-top: 3px; }
.callout p { margin: 0; }
.callout strong { color: var(--ink); }
.callout-warn { background: var(--amber-50); border-color: var(--amber-100); }
.callout-warn > .ic { color: var(--amber); }
.callout-teal { background: var(--teal-50); border-color: var(--teal-100); }
.callout-teal > .ic { color: var(--teal); }

/* ---------- Tables ---------- */
.table-wrap { position: relative; overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); }
table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
caption { text-align: start; padding: 12px 16px 0; color: var(--muted); font-size: 13.5px; caption-side: top; }
th { text-align: start; font-weight: 600; color: var(--ink-2); background: var(--surface-2); padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: bottom; }
td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink-2); }
tbody tr:last-child td { border-bottom: 0; }
td.nowrap, th.nowrap { white-space: nowrap; }
td strong { color: var(--ink); font-weight: 600; }
.td-sub { display: block; color: var(--muted); font-size: 13.5px; margin-top: 3px; }
tbody tr:target td { background: var(--amber-50); }
@media (max-width: 760px) {
  .rtable thead { display: none; }
  .rtable, .rtable tbody, .rtable tr, .rtable td { display: block; width: 100%; }
  .rtable tr { border-bottom: 1px solid var(--line); padding: 8px 0; }
  .rtable tbody tr:last-child { border-bottom: 0; }
  .rtable td { display: grid; grid-template-columns: minmax(96px, 34%) 1fr; gap: 10px; border: 0; padding: 6px 14px; }
  .rtable td::before { content: attr(data-label); font-weight: 600; color: var(--muted); font-size: 12.5px; }
  .rtable td.nowrap { white-space: normal; }
}

/* ---------- Toolbar / filters ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin: 0 0 16px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.search { position: relative; flex: 1 1 260px; min-width: 200px; }
.search .ic { position: absolute; inset-inline-start: 11px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.search input { width: 100%; padding: 9px 12px; padding-inline-start: 36px; border: 1px solid var(--line-2); border-radius: 8px; font: inherit; font-size: 14.5px; background: var(--surface); color: var(--ink); }
.search input:focus { outline: 3px solid var(--focus); outline-offset: 0; border-color: var(--focus); }
.filter-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.filter-label { font-size: 13px; color: var(--muted); }
.result-count { font-size: 13.5px; color: var(--muted); margin-inline-start: auto; }
.toolbar .btn { padding: 7px 10px; font-size: 13.5px; }
.empty { padding: 28px; text-align: center; color: var(--muted); border: 1px dashed var(--line-2); border-radius: var(--radius); background: var(--surface); }

/* ---------- Section A ---------- */
.card-accent { border-top: 3px solid var(--teal); }
.problem-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; }
.problem-grid li { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; font-size: 15px; color: var(--ink-2); }
.pn { flex: none; width: 24px; height: 24px; border-radius: 6px; background: var(--amber-50); color: var(--amber); display: grid; place-items: center; font-size: 12.5px; font-weight: 600; font-family: var(--font-en); }
.obj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.obj { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow-sm); }
.obj-n { font-family: var(--font-mono); font-size: 12px; color: var(--teal); font-weight: 500; }
.obj h4 { font-size: 15.5px; margin: 4px 0 6px; font-weight: 600; }
.obj p { font-size: 14.5px; color: var(--ink-2); margin: 0; }
.user-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.user-card { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.user-card > .ic { width: 34px; height: 34px; padding: 7px; border-radius: 8px; background: var(--blue-50); color: var(--blue); }
.user-card h4 { margin: 0 0 3px; font-size: 15px; font-weight: 600; }
.user-card p { margin: 0; font-size: 14px; color: var(--ink-2); }
.dec-mini { list-style: none; margin: 0 0 10px; padding: 0; }
.dec-mini li { display: grid; grid-template-columns: 52px 1fr; gap: 2px 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.dec-mini li:last-child { border-bottom: 0; }
.dec-mini .meta { grid-column: 2; font-size: 13px; color: var(--muted); }
.dec-mini a.code { font-weight: 500; }

/* ---------- Section B ---------- */
.lifecycle { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; }
.lifecycle li { position: relative; padding: 18px 16px 18px 18px; border-inline-end: 1px solid var(--line); }
.lifecycle li:last-child { border-inline-end: 0; }
.lifecycle li:not(:last-child)::after { content: ""; position: absolute; top: 30px; inset-inline-end: -7px; width: 12px; height: 12px; background: var(--surface); border-top: 1px solid var(--line-2); border-inline-end: 1px solid var(--line-2); transform: rotate(45deg); z-index: 1; }
[dir="rtl"] .lifecycle li:not(:last-child)::after { transform: rotate(-45deg); }
.lc-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.lc-top .ic { width: 30px; height: 30px; padding: 6px; border-radius: 8px; background: var(--teal-50); color: var(--teal); }
.lc-n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.lifecycle h4 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
.lifecycle p { margin: 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.55; }
html[lang="ar"] .lifecycle p { line-height: 1.75; }
.diagram { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 14px; }
.diagram svg { display: block; width: 100%; height: auto; }
.diagram figcaption, .fig-cap { font-size: 13.5px; color: var(--muted); padding: 10px 6px 2px; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); gap: 18px; align-items: start; }
.svg-text { font-family: var(--font-en); }
.hub-fig { margin: 16px 0 0; }
.hub-fig svg { max-width: 980px; margin: 0 auto; }
.hub-steps { columns: 2; column-gap: 32px; }
.hub-steps li { break-inside: avoid; margin-top: 0; }
@media (max-width: 980px) { .hub-steps { columns: 1; } }
html[lang="ar"] .svg-text { font-family: var(--font-ar); }

/* Swimlane */
.swim-scroll { position: relative; overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.swim { position: relative; display: grid; grid-template-columns: repeat(6, minmax(140px, 1fr)); min-width: 860px; }
.swim-head { position: sticky; top: 0; padding: 12px 10px; background: var(--surface-2); border-bottom: 1px solid var(--line); border-inline-end: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--ink-2); text-align: center; z-index: 2; }
.swim-lane { border-inline-end: 1px solid var(--line); }
.swim-head:last-of-type, .swim-lane.last { border-inline-end: 0; }
.swim-step { position: relative; z-index: 2; margin: 12px 12px 8px 14px; padding: 8px 10px 8px 14px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; font-size: 13px; line-height: 1.45; color: var(--ink-2); box-shadow: var(--shadow-sm); }
[dir="rtl"] .swim-step { margin: 12px 14px 8px 12px; padding: 8px 14px 8px 10px; }
.swim-step .wf-ref { font-size: 11.5px; white-space: nowrap; margin-inline-start: 2px; }
html[lang="ar"] .swim-step { line-height: 1.65; font-size: 13.5px; }
.swim-step.cond { border-style: dashed; background: var(--surface-2); }
.swim-step .sn { position: absolute; top: -9px; inset-inline-start: -9px; width: 22px; height: 22px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 11.5px; font-weight: 600; display: grid; place-items: center; font-family: var(--font-en); }
.swim-step.cond .sn { background: var(--slate); }
.swim-step .lane-label { display: none; }
.swim-links { position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: visible; }
.swim-links path { fill: none; stroke: var(--line-2); stroke-width: 1.5; }
.swim-links path.cond { stroke-dasharray: 4 4; }
.legend-inline { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); margin-top: 10px; align-items: center; }
.legend-inline span { display: inline-flex; align-items: center; gap: 7px; }
.lg-box { width: 22px; height: 14px; border-radius: 4px; border: 1px solid var(--line-2); background: var(--surface); display: inline-block; }
.lg-box.dashed { border-style: dashed; background: var(--surface-2); }
.cmp-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.cmp-cards .card { padding: 16px 18px; }
.cmp-cards p { font-size: 14px; color: var(--ink-2); margin: 8px 0 0; }

/* ---------- Section C: modules ---------- */
.module-list { display: grid; gap: 10px; }
.module { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); scroll-margin-top: calc(var(--topbar-h) + 20px); }
.module.is-open { border-color: var(--line-2); box-shadow: var(--shadow); }
.module h3, .srow h3 { margin: 0; font-size: inherit; font-weight: inherit; }
.module-toggle, .srow-btn { font-weight: 400; color: var(--ink-2); }
.module-toggle { width: 100%; display: grid; grid-template-columns: 34px 40px minmax(0, 1fr) auto 22px; gap: 14px; align-items: center; padding: 14px 18px; background: none; border: 0; text-align: start; cursor: pointer; border-radius: var(--radius); }
.module-toggle:hover .module-name { color: var(--blue); }
.module-num { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-weight: 500; }
.module-icon { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--blue-50); color: var(--blue); }
.module[data-group="operations"] .module-icon { background: var(--teal-50); color: var(--teal); }
.module[data-group="supply"] .module-icon { background: var(--amber-50); color: var(--amber); }
.module[data-group="platform"] .module-icon { background: var(--slate-50); color: var(--slate); }
.module[data-scope="optional"] .module-icon { background: var(--violet-50); color: var(--violet); }
.module-icon .ic { width: 20px; height: 20px; }
.module-title { display: flex; flex-direction: column; min-width: 0; }
.module-name { font-size: 16px; font-weight: 600; color: var(--ink); line-height: 1.4; }
.module-sum { font-size: 14px; color: var(--muted); line-height: 1.5; margin-top: 2px; }
.module-tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 280px; }
.chev { color: var(--muted); transition: transform .2s ease; }
.module.is-open .chev { transform: rotate(180deg); }
.module-body { padding: 4px 22px 22px; border-top: 1px solid var(--line); }
.module-purpose { font-size: 15.5px; color: var(--ink-2); max-width: 900px; margin: 18px 0; }
.module-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
.field { padding: 14px 0; border-top: 1px solid var(--line); min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field h4 { font-size: 12.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
html[lang="ar"] .field h4 { letter-spacing: 0; font-size: 13.5px; }
.field ul.list > li { font-size: 14.5px; margin: 5px 0; }
.perm { margin: 0; display: grid; gap: 8px; }
.perm div { display: grid; grid-template-columns: minmax(120px, 34%) 1fr; gap: 10px; font-size: 14.5px; }
.perm dt { margin: 0; }
.perm dd { margin: 0; color: var(--ink-2); }
.rule { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.rule .tag { margin-top: 2px; }
.dep-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; font-size: 13.5px; }
.dep-row .lbl { color: var(--muted); min-width: 74px; }

/* ---------- Status flows (D) ---------- */
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.state { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 5px 10px; border-radius: 6px; background: var(--blue-50); border: 1px solid var(--blue-100); color: var(--navy); font-weight: 500; white-space: nowrap; }
.state.final { background: var(--green-50); border-color: var(--green-100); color: var(--green); }
.state.alt { background: var(--surface); border-style: dashed; border-color: var(--line-2); color: var(--ink-2); }
.flow .arr { color: var(--faint); }
.status-models { display: grid; grid-template-columns: 1fr; gap: 12px; }
.sm-card { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 14px; align-items: start; }
.sm-card h4 { margin: 4px 0 0; }
.sm-card .alt-row { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.alt-label { font-size: 12.5px; color: var(--muted); margin-inline-end: 4px; }
.wf-layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 18px; align-items: start; }
.wf-tabs { display: flex; flex-direction: column; gap: 4px; position: sticky; top: calc(var(--topbar-h) + 20px); }
.wf-tab { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; text-align: start; padding: 10px 12px; border: 1px solid transparent; border-radius: 9px; background: none; cursor: pointer; font-size: 14px; line-height: 1.45; color: var(--ink-2); }
.wf-tab:hover { background: var(--surface); border-color: var(--line); }
.wf-tab[aria-selected="true"] { background: var(--surface); border-color: var(--blue-100); box-shadow: var(--shadow-sm); color: var(--ink); font-weight: 600; }
.wf-tab .n { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--surface-3); font-size: 12.5px; font-weight: 600; font-family: var(--font-en); color: var(--ink-2); }
.wf-tab[aria-selected="true"] .n { background: var(--blue); color: #fff; }
.wf-panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px 24px; min-width: 0; }
.wf-panel h3 { margin: 6px 0 6px; font-size: 20px; font-weight: 600; line-height: 1.35; }
.wf-kicker { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.wf-meta { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 16px 0 6px; font-size: 14px; }
.wf-meta dt { color: var(--muted); }
.wf-meta dd { margin: 0; }
.block-title { font-size: 12.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 22px 0 10px; }
html[lang="ar"] .block-title { letter-spacing: 0; font-size: 13.5px; }
.alt-list { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
.alt-list li { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; font-size: 14px; color: var(--ink-2); }
.steps { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.steps li { display: grid; grid-template-columns: 30px minmax(110px, max-content) minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 11px 14px; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.steps li:last-child { border-bottom: 0; }
.steps li:nth-child(even) { background: #fafbfd; }
.steps .sn { width: 24px; height: 24px; border-radius: 50%; background: var(--blue-50); color: var(--blue); font-size: 12px; font-weight: 600; display: grid; place-items: center; font-family: var(--font-en); }
.steps .st { justify-self: end; }

/* ---------- Section E: architecture ---------- */
.principles { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; counter-reset: p; }
.principles li { counter-increment: p; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px 12px 14px; font-size: 14.5px; color: var(--ink-2); display: flex; gap: 10px; }
.principles li::before { content: counter(p, decimal-leading-zero); font-family: var(--font-mono); font-size: 12px; color: var(--teal); margin-top: 2px; }
.cmp-table td.edge { white-space: nowrap; }
.favour { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.favour.mono { color: var(--teal); }
.favour.micro { color: var(--violet); }
.recommend { margin-top: 16px; }
.arch-layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 18px; align-items: start; }
.arch { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 16px; display: grid; gap: 0; }
.tier { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 12px; background: var(--surface-2); }
.tier-label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
html[lang="ar"] .tier-label { letter-spacing: 0; font-size: 13px; }
.tier-app { background: var(--blue-50); border-color: var(--blue-100); }
.tier-app > .tier-label { color: var(--blue); }
.tier-nodes { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.tier-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 12px; }
.anode { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: start; padding: 9px 11px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; cursor: pointer; min-height: 62px; }
.anode:hover { border-color: var(--blue-600); }
.anode[aria-pressed="true"] { border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue-100); }
.anode .an-top { display: flex; gap: 7px; align-items: center; font-size: 13.5px; font-weight: 600; color: var(--ink); line-height: 1.3; }
.anode .an-top .ic { color: var(--blue); width: 16px; height: 16px; }
.anode .an-tech { font-size: 12px; color: var(--muted); line-height: 1.35; }
.anode.st-pending { border-style: dashed; border-color: #d7a85a; }
.anode.st-future { border-style: dotted; border-color: var(--faint); background: var(--surface-2); }
.anode.st-optional { border-style: dashed; border-color: var(--violet); }
.anode .an-badge { position: absolute; top: 6px; inset-inline-end: 7px; width: 8px; height: 8px; border-radius: 50%; }
.anode.st-pending .an-badge { background: var(--amber); }
.anode.st-future .an-badge { background: var(--faint); }
.app-nodes { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.anode.wide { grid-column: 1 / -1; }
.mod-mini { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
.mod-mini span { width: 22px; height: 18px; border-radius: 4px; font-size: 10.5px; display: grid; place-items: center; font-family: var(--font-mono); background: var(--blue-50); color: var(--blue); }
.mod-mini span.g-operations { background: var(--teal-50); color: var(--teal); }
.mod-mini span.g-supply { background: var(--amber-50); color: var(--amber); }
.mod-mini span.g-platform { background: var(--slate-50); color: var(--slate); }
.mod-mini span.opt { outline: 1px dashed var(--violet); background: var(--violet-50); color: var(--violet); }
.aflow { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 7px 0; font-size: 12.5px; color: var(--muted); text-align: center; }
.aflow .ic { color: var(--faint); }
.aflow-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 12px; }
.arch-detail { position: sticky; top: calc(var(--topbar-h) + 20px); }
.arch-detail .card { box-shadow: var(--shadow); }
.arch-detail h3 { margin: 4px 0 6px; font-size: 18px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.arch-detail .tech { font-size: 14px; color: var(--ink-2); background: var(--surface-2); border-radius: 8px; padding: 8px 10px; margin: 10px 0; }
.arch-detail p { font-size: 14.5px; color: var(--ink-2); }

/* ---------- Section F ---------- */
.stack-list { display: grid; gap: 8px; }
.srow { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.srow-btn { width: 100%; display: grid; grid-template-columns: 200px minmax(0, 1fr) minmax(0, 1fr) 110px 20px; gap: 14px; align-items: center; padding: 12px 16px; background: none; border: 0; text-align: start; cursor: pointer; border-radius: var(--radius); }
.srow-btn:hover .s-layer { color: var(--blue); }
.s-layer { font-weight: 600; font-size: 14.5px; color: var(--ink); display: flex; align-items: center; gap: 8px; }
.s-layer .ic { color: var(--teal); }
.s-choice { font-size: 14.5px; color: var(--ink); }
.s-alt { font-size: 13.5px; color: var(--muted); }
.s-colhead { display: grid; grid-template-columns: 200px minmax(0, 1fr) minmax(0, 1fr) 110px 20px; gap: 14px; padding: 0 16px 6px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
html[lang="ar"] .s-colhead { letter-spacing: 0; font-size: 13px; }
.srow.is-open .chev { transform: rotate(180deg); }
.srow-body { border-top: 1px solid var(--line); padding: 6px 18px 18px; }
.srow-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 24px; }
.kv { padding: 12px 0 0; }
.kv h4 { font-size: 12.5px; font-weight: 600; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; margin: 0 0 6px; }
html[lang="ar"] .kv h4 { letter-spacing: 0; font-size: 13.5px; }
.kv p { font-size: 14.5px; color: var(--ink-2); margin: 0; }
.dec-table td:first-child { font-family: var(--font-mono); font-size: 13px; white-space: nowrap; }
.count-pill { display: inline-grid; place-items: center; min-width: 20px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--surface-3); font-size: 11.5px; font-weight: 600; margin-inline-start: 4px; font-family: var(--font-en); }

/* ---------- Section G ---------- */
.er-wrap { position: relative; overflow-x: auto; }
.er-wrap svg { min-width: 760px; }
.er-ent { cursor: pointer; }
.er-ent rect.box { fill: var(--surface); stroke: var(--line-2); stroke-width: 1.2; }
.er-ent rect.bar { stroke: none; }
.er-ent text.id { font-family: var(--font-mono); font-size: 12.5px; font-weight: 500; fill: var(--ink); }
.er-ent text.nm { font-size: 11.5px; fill: var(--muted); }
.er-ent:hover rect.box, .er-ent:focus rect.box { stroke: var(--blue); stroke-width: 2; }
.er-ent:focus { outline: none; }
.er-ent:focus-visible rect.box { stroke: var(--focus); stroke-width: 3; }
.er-rel { fill: none; stroke: #a3b1c2; stroke-width: 1.3; }
.er.has-sel .er-rel { opacity: .18; }
.er.has-sel .er-rel.hl { opacity: 1; stroke: var(--blue); stroke-width: 2; }
.er.has-sel .er-ent { opacity: .35; }
.er.has-sel .er-ent.rel, .er.has-sel .er-ent.sel { opacity: 1; }
.er.has-sel .er-ent.sel rect.box { stroke: var(--blue); stroke-width: 2.2; fill: var(--blue-50); }
.er-caption { margin-top: 10px; padding: 12px 14px; border-radius: 8px; background: var(--surface-2); font-size: 14.5px; color: var(--ink-2); min-height: 48px; }
.er-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--ink-2); margin-top: 10px; }
.er-legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.c-blue { background: var(--blue); } .c-teal { background: var(--teal); } .c-green { background: var(--green); } .c-navy { background: var(--navy); }
.c-violet { background: var(--violet); } .c-amber { background: #c07a12; } .c-slate { background: var(--slate); }
.ent-table td:first-child { white-space: nowrap; }
.policy-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }

/* ---------- Section H ---------- */
.sec-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.sec-card .pd { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 13.5px; background: var(--surface-2); color: var(--ink-2); }
.sec-card.policy .pd { background: var(--amber-50); }

/* ---------- Section I: roadmap ---------- */
.rm-notes { margin-bottom: 16px; }
.rm-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); margin: 0 0 10px; align-items: center; }
.rm-legend span { display: inline-flex; align-items: center; gap: 7px; }

  /* =====================================================================
     B — Business scope & operating model
     ===================================================================== */
  function hubSvg() {
    const Hb = D.scope.hub;
    const W = 1000, Hh = 600, rtl = isRtl();
    const pos = { sr: [170, 90], ppm: [500, 64], insp: [830, 90], asset: [140, 270], doc: [860, 270], loc: [170, 450], tech: [500, 480], inv: [830, 430], proc: [830, 548] };
    const dir = { sr: 'in', ppm: 'in', insp: 'in', doc: 'in', asset: 'out', loc: 'out', tech: 'out', inv: 'out' };
    const X = (x) => (rtl ? W - x : x);
    const C = [X(500), 270];
    const bw = 196, bh = 58;
    const lines = (lbl) => T(lbl).split('|');
    const clip = (from, to, w, h) => {           // point where segment from->to leaves box centred at `to`
      const dx = from[0] - to[0], dy = from[1] - to[1];
      const sx = Math.abs(dx) / (w / 2 + 6), sy = Math.abs(dy) / (h / 2 + 6);
      const s = Math.max(sx, sy) || 1;
      return [to[0] + dx / s, to[1] + dy / s];
    };
    let edges = '', labels = '', nodes = '';
    const nodeBox = (id, p, lbl, ic, center) => {
      const ls = lines(lbl);
      const w = center ? 200 : bw, h = center ? 64 : bh;
      const x = p[0] - w / 2, y = p[1] - h / 2;
      const iconX = rtl ? x + w - 30 : x + 10;
      const tx = rtl ? x + w - 38 : x + 38;
      const anchor = 'start';          // with direction set explicitly, 'start' is the reading start in both languages
      const fs = center ? 18 : 15;
      const t0 = p[1] - ((ls.length - 1) * (fs + 3)) / 2 + fs * 0.35;
      return `<g class="hub-node${center ? ' center' : ''}">
        <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${center ? 'var(--blue)' : 'var(--surface)'}" stroke="${center ? 'var(--blue)' : 'var(--line-2)'}" stroke-width="1.3"/>
        <use href="#i-${ic}" x="${iconX}" y="${p[1] - 10}" width="20" height="20" style="stroke:${center ? '#fff' : 'var(--teal)'};fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"/>
        ${ls.map((l, i) => `<text class="svg-text" x="${tx}" y="${t0 + i * (fs + 3)}" text-anchor="${anchor}" direction="${rtl ? 'rtl' : 'ltr'}" font-size="${fs}" font-weight="600" fill="${center ? '#fff' : 'var(--ink)'}">${esc(l)}</text>`).join('')}
      </g>`;
    };
    Hb.nodes.forEach((n) => {
      const p = [X(pos[n.id][0]), pos[n.id][1]];
      const a = dir[n.id] === 'in' ? clip(C, p, bw, bh) : clip(p, C, 200, 64);
      const b = dir[n.id] === 'in' ? clip(p, C, 200, 64) : clip(C, p, bw, bh);
      edges += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#9fb0c3" stroke-width="1.5" marker-end="url(#hub-arrow)"/>`;
      const mx = (p[0] + C[0]) / 2, my = (p[1] + C[1]) / 2;
      labels += `<text class="svg-text hub-lbl" x="${mx}" y="${my + 4}" text-anchor="middle" direction="${rtl ? 'rtl' : 'ltr'}" font-size="13.5" fill="var(--ink-2)" stroke="var(--surface)" stroke-width="5" paint-order="stroke" stroke-linejoin="round">${H(n.edge)}</text>`;
      nodes += nodeBox(n.id, p, n.label, n.icon, false);
    });
    Hb.extra.forEach((e) => {
      const pa = [X(pos[e.from][0]), pos[e.from][1]], pb = [X(pos[e.to][0]), pos[e.to][1]];
      const a = clip(pb, pa, bw, bh), b = clip(pa, pb, bw, bh);
      edges += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#9fb0c3" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#hub-arrow)"/>`;
      const mx = (pa[0] + pb[0]) / 2, my = (pa[1] + pb[1]) / 2;
      labels += `<text class="svg-text hub-lbl" x="${mx + (rtl ? -10 : 10)}" y="${my + 4}" text-anchor="start" direction="${rtl ? 'rtl' : 'ltr'}" font-size="13.5" fill="var(--ink-2)" stroke="var(--surface)" stroke-width="5" paint-order="stroke" stroke-linejoin="round">${H(e.label)}</text>`;
    });
    nodes += nodeBox('proc', [X(pos.proc[0]), pos.proc[1]], Hb.proc.label, Hb.proc.icon, false);
    nodes += nodeBox('wo', C, Hb.center, 'wrench', true);
    return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-labelledby="hub-title hub-desc">
      <title id="hub-title">${UA('hubTitle')}</title><desc id="hub-desc">${UA('hubDesc')}</desc>
      <defs><marker id="hub-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#9fb0c3"/></marker></defs>
      ${edges}${labels}${nodes}
    </svg>`;
  }

     C — Modules
     ===================================================================== */
  function moduleMatches(m) {
    if (S.modGroup !== 'all' && m.group !== S.modGroup) return false;

    const hay = [T(m.name), T(m.summary), T(m.purpose), String(m.num), pad2(m.num)]
      .concat(T(m.capabilities) || [], T(m.workflows) || [], m.entities || [], (m.users || []).map((u) => roleName(u.role)))
      .join(' ').toLowerCase();
    return q.split(/\s+/).every((w) => hay.includes(w));
  }

  /* =====================================================================
     G — Data architecture (conceptual ER diagram)
     ===================================================================== */
  const DOMAIN_COLOR = { blue: '#1b4f8c', teal: '#0b6f67', green: '#2c7549', navy: '#14325a', violet: '#574a9e', amber: '#c07a12', slate: '#4b5a6d' };
  const ER = { cw: 196, rh: 88, bw: 166, bh: 50, x0: 18, y0: 18, cols: 6, rows: 7 };
  function erBox(e) {
    const W = ER.x0 * 2 + (ER.cols - 1) * ER.cw + ER.bw;
    let x = ER.x0 + e.x * ER.cw;
    if (isRtl()) x = W - x - ER.bw;
    return { x, y: ER.y0 + e.y * ER.rh, w: ER.bw, h: ER.bh };
  }
  function erEdge(b, from) {   // point on box b's border towards point `from`
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    const dx = from[0] - cx, dy = from[1] - cy;
    const s = Math.max(Math.abs(dx) / (b.w / 2), Math.abs(dy) / (b.h / 2)) || 1;
    return [cx + dx / s, cy + dy / s];
  }
  function erSvg() {
    const W = ER.x0 * 2 + (ER.cols - 1) * ER.cw + ER.bw;
    const Hh = ER.y0 * 2 + (ER.rows - 1) * ER.rh + ER.bh;
    const dom = byId(D.dataDomains);
    const rels = D.relations.map(([a, b, card], i) => {
      const A1 = erBox(ENTI[a]), B1 = erBox(ENTI[b]);
      const ca = [A1.x + A1.w / 2, A1.y + A1.h / 2], cb = [B1.x + B1.w / 2, B1.y + B1.h / 2];
      const p = erEdge(A1, cb), q = erEdge(B1, ca);
      const ms = card === 'NN' ? 'many' : 'one';
      const me = card === '11' ? 'zone' : 'many';
      return `<line class="er-rel" data-a="${a}" data-b="${b}" x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${q[0].toFixed(1)}" y2="${q[1].toFixed(1)}" marker-start="url(#er-${ms})" marker-end="url(#er-${me})"><title>${esc(a)} — ${esc(b)} (${card === '1N' ? '1 : N' : card === 'NN' ? 'N : N' : '1 : 0..1'})</title></line>`;
    }).join('');

  function drawLinks(svgSel, gridSel, pairs, mode) {
    const svg = $(svgSel), grid = $(gridSel);
    if (!svg || !grid || !grid.offsetParent) return;
    const g = grid.getBoundingClientRect();
    const W = grid.scrollWidth, Hh = grid.scrollHeight;
    svg.setAttribute('viewBox', `0 0 ${W} ${Hh}`);
    svg.setAttribute('width', W); svg.setAttribute('height', Hh);
    const rtl = isRtl();
    let out = `<defs>
      <marker id="${svg.id}-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b4c0ce"/></marker>
      <marker id="${svg.id}-ah-in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0b6f67"/></marker>
      <marker id="${svg.id}-ah-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#574a9e"/></marker></defs>`;
    pairs.forEach(([fromEl, toEl, cls]) => {
      if (!fromEl || !toEl) return;
      const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
      let d;
      if (mode === 'horizontal') {
        const ax = (rtl ? a.left : a.right) - g.left, ay = a.top + a.height / 2 - g.top;
        const bx = (rtl ? b.right : b.left) - g.left, by = b.top + b.height / 2 - g.top;
        const dx = (bx - ax) / 2;
        d = `M${ax.toFixed(1)} ${ay.toFixed(1)} C${(ax + dx).toFixed(1)} ${ay.toFixed(1)} ${(bx - dx).toFixed(1)} ${by.toFixed(1)} ${bx.toFixed(1)} ${by.toFixed(1)}`;
      } else {
        const ax = a.left + a.width / 2 - g.left, ay = a.bottom - g.top;
        const bx = b.left + b.width / 2 - g.left, by = b.top - g.top;
        const dy = Math.max(10, (by - ay) / 2);
        const skip = Math.abs(ax - bx) < 4 && toEl.getBoundingClientRect().top - fromEl.getBoundingClientRect().bottom > 30;
        if (skip) {               // same column, not adjacent: route around the cards in between
          const sx = (rtl ? a.left : a.right) - g.left, sy = a.top + a.height / 2 - g.top;
          const ex = (rtl ? b.left : b.right) - g.left, ey = b.top + b.height / 2 - g.top;
          const off = rtl ? -34 : 34;
          d = `M${sx.toFixed(1)} ${sy.toFixed(1)} C${(sx + off).toFixed(1)} ${sy.toFixed(1)} ${(ex + off).toFixed(1)} ${ey.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`;
        } else {
          d = `M${ax.toFixed(1)} ${ay.toFixed(1)} C${ax.toFixed(1)} ${(ay + dy).toFixed(1)} ${bx.toFixed(1)} ${(by - dy).toFixed(1)} ${bx.toFixed(1)} ${by.toFixed(1)}`;
        }
      }
      const mk = cls && cls.includes('in') ? '-in' : cls && cls.includes('out') ? '-out' : '';
      out += `<path class="${cls || ''}" d="${d}" marker-end="url(#${svg.id}-ah${mk})"/>`;
    });
    svg.innerHTML = out;
  }
  function drawRoadmap() {
    const sel = S.phase;

  function renderM() {
    return section('m', `
      <div class="callout callout-warn" style="margin-bottom:16px">${icon('alert')}<p>${U('deliverablesNote')}</p></div>
      <div class="legend-inline" style="margin:0 0 12px">${tag('brief', ui('tag_brief'))}<span>${U('tagd_brief')}</span>${tag('proposed', ui('tag_proposedDl'))}<span>${U('tagd_proposedDl')}</span></div>
      <div class="table-wrap">
        <table class="rtable">
          <thead><tr><th scope="col">${U('id')}</th><th scope="col">${U('deliverable')}</th><th scope="col">${U('acceptanceEvidence')}</th><th scope="col">${U('producedIn')}</th><th scope="col">${U('commitment')}</th></tr></thead>
          <tbody>${D.deliverables.map((d) => `<tr>${td(ui('id'), `<span class="code">${esc(d.id)}</span>`, 'nowrap')}${td(ui('deliverable'), `<strong>${H(d.name)}</strong><span class="td-sub">${H(d.desc)}</span>`)}${td(ui('acceptanceEvidence'), H(d.acceptance))}${td(ui('producedIn'), phaseChip(d.phase))}${td(ui('commitment'), d.status === 'brief' ? tag('brief', ui('tag_brief')) : tag('proposed', ui('tag_proposedDl')))}</tr>`).join('')}</tbody>
        </table>
      </div>`);
  }

  /* =====================================================================
     N — Risks
     ===================================================================== */
  const lvl = (n) => `<span class="lvl lvl-${n}"><i></i>${U('lvl' + n)}</span>`;
  function renderN() {
    const cells = [];
    for (let li = 3; li >= 1; li--) {
      cells.push(li === 3 ? `<div class="ax y" style="grid-row:1 / span 3;grid-column:1">${U('likelihood')} →</div>` : '');
      for (let im = 1; im <= 3; im++) {
        const rs = D.risks.filter((r) => r.likelihood === li && r.impact === im);
        cells.push(`<div class="hcell hm-${li * im}" style="grid-row:${4 - li};grid-column:${im + 1}" aria-label="${UA('likelihood')} ${UA('lvl' + li)}, ${UA('impact')} ${UA('lvl' + im)}">${rs.map((r) => `<button type="button" data-action="risk" data-id="${r.id}" aria-pressed="${S.risk === r.id}" title="${A(r.title)}">${esc(r.id)}</button>`).join('')}</div>`);
      }
    }
    cells.push(`<div class="ax" style="grid-row:4;grid-column:2 / span 3">${U('impact')} →</div>`);
    return section('n', `
      <div class="callout callout-warn" style="margin-bottom:18px">${icon('alert')}<p>${U('riskNote')}</p></div>
      ${sub(U('riskRegister'), 'alert', 'risk-register')}
      <div class="risk-layout">
        <div class="card">
          <h4>${U('heatmap')}</h4>
          <div class="heat" role="group" aria-label="${UA('heatmap')}">${cells.join('')}</div>
          <p class="heat-cap">${U('heatCap')}</p>
        </div>
        <div class="card">
          <h4>${U('priorityRisks')}</h4>
          <ul class="prio-list">${D.risks.filter((r) => r.likelihood * r.impact >= 6).sort((x, y) => y.likelihood * y.impact - x.likelihood * x.impact).map((r) => `<li><a class="code" href="#risk-${r.id}" data-action="risk" data-id="${r.id}">${esc(r.id)}</a><span>${H(r.title)}</span><span class="score">${r.likelihood} × ${r.impact}</span></li>`).join('')}</ul>
          <p class="heat-cap">${U('priorityRisksNote')}</p>
        </div>
      </div>
      <div class="table-wrap">
          <table class="rtable risk-table">
            <thead><tr><th scope="col">${U('id')}</th><th scope="col">${U('risk')}</th><th scope="col">${U('likelihood')}</th><th scope="col">${U('impact')}</th><th scope="col">${U('mitigation')}</th><th scope="col">${U('owner')}</th><th scope="col">${U('status')}</th></tr></thead>
            <tbody>${D.risks.map((r) => `<tr id="risk-${r.id}"${S.risk === r.id ? ' class="is-hl"' : ''}>${td(ui('id'), esc(r.id))}${td(ui('risk'), `<strong>${H(r.title)}</strong><span class="td-sub">${H(r.desc)}</span>`)}${td(ui('likelihood'), lvl(r.likelihood))}${td(ui('impact'), lvl(r.impact))}${td(ui('mitigation'), L(r.mitigation, 'dense'))}${td(ui('owner'), esc(roleName(r.owner)))}${td(ui('status'), tag('open', ui('riskOpen')))}</tr>`).join('')}</tbody>
          </table>
      </div>
      ${sub(U('dependencies'), 'link')}
      <div class="table-wrap">
        <table class="rtable">
          <thead><tr><th scope="col">${U('id')}</th><th scope="col">${U('dependency')}</th><th scope="col">${U('owner')}</th><th scope="col">${U('neededBy')}</th></tr></thead>
          <tbody>${D.dependencies.map((d) => `<tr>${td(ui('id'), `<span class="code">${esc(d.id)}</span>`, 'nowrap')}${td(ui('dependency'), H(d.text))}${td(ui('owner'), esc(roleName(d.owner)))}${td(ui('neededBy'), phaseChip(d.by))}</tr>`).join('')}</tbody>
        </table>
      </div>
      ${sub(U('openDecisions'), 'help')}
      <div class="callout">${icon('info')}<p>${esc(ui('openDecisionsText').replace('{p}', D.decisions.filter((d) => d.status === 'pending').length).replace('{r}', D.decisions.filter((d) => d.status === 'proposed').length))} <a href="#decision-register" data-action="goto-dec" data-id="">${U('seeRegister')}</a> · <a href="#next-decisions">${U('seeNext')}</a></p></div>`);
  }

  /* =====================================================================
     O — Glossary & next decisions
     ===================================================================== */
  function glossRows() {
    const q = S.glossQ.trim().toLowerCase();
    const rows = D.glossary.filter((g) => !q || [g.term, T(g.exp), T(g.def), g.exp.en, g.exp.ar].join(' ').toLowerCase().includes(q));
    if (!rows.length) return `<tr><td colspan="3" class="muted" style="text-align:center;padding:24px">${U('noResults')}</td></tr>`;
    return rows.map((g) => `<tr>${td(ui('term'), esc(g.term))}${td(ui('meaning'), `<strong>${H(g.exp)}</strong>${S.lang === 'en' ? `<span class="td-sub" lang="ar" dir="rtl" style="font-family:var(--font-ar)">${esc(g.exp.ar)}</span>` : `<span class="td-sub" lang="en" dir="ltr" style="font-family:var(--font-en)">${esc(g.exp.en)}</span>`}`)}${td(ui('definition'), H(g.def))}</tr>`).join('');
  }
  function renderO() {
    return section('o', `
      ${sub(U('nextDecisions'), 'flag', 'next-decisions')}
      <p class="sub-note">${U('nextDecisionsIntro')}</p>
      <ol class="next-list">${D.nextDecisions.map((n) => `<li><h4>${H(n.q)}</h4><p>${H(n.why)}</p><div class="chips">${roleChip(n.owner)}<span class="chip">${U('decideBy')}</span>${phaseChip(n.by)}</div></li>`).join('')}</ol>
      ${sub(U('glossary'), 'book', 'glossary')}
      <div class="toolbar" role="search">
        <label class="search"><span class="sr-only">${U('searchGlossary')}</span>${icon('search')}<input type="search" id="gloss-search" placeholder="${UA('searchGlossaryPh')}" value="${esc(S.glossQ)}" autocomplete="off"></label>
        <span class="result-count" id="gloss-count" aria-live="polite"></span>
      </div>
      <div class="table-wrap">
        <table class="rtable gloss-table">
          <thead><tr><th scope="col">${U('term')}</th><th scope="col">${U('meaning')}</th><th scope="col">${U('definition')}</th></tr></thead>
          <tbody id="gloss-body">${glossRows()}</tbody>
        </table>
      </div>`);
  }
  function updateGlossCount() {
    const el = $('#gloss-count');
    if (el) el.textContent = ui('showingOf').replace('{n}', $$('#gloss-body tr').filter((r) => r.children.length === 3).length).replace('{t}', D.glossary.length);
  }

  function renderFooter() {
    return `<footer class="doc-footer">
      <div>
        <p style="margin:0 0 6px;color:var(--ink);font-weight:600">${U('docControl')}</p>
        <p style="margin:0">${U('footerNote')}</p>
      </div>
      <div class="table-wrap" style="box-shadow:none">
        <table><thead><tr><th>${U('metaVersion')}</th><th>${U('date')}</th><th>${U('change')}</th></tr></thead>
        <tbody><tr><td>${esc(D.meta.version)}</td><td class="nowrap">${H(D.meta.prepared)}</td><td>${U('rev01')}</td></tr></tbody></table>
      </div>
    </footer>`;
  }

  /* =====================================================================
     Render & behaviour
     ===================================================================== */
  function renderAll() {
    document.documentElement.lang = S.lang;
    document.documentElement.dir = isRtl() ? 'rtl' : 'ltr';
    document.title = ui('docTitle');
    renderTopbar();
    renderNav();
    $('#doc').innerHTML = [renderCover(), renderA(), renderB(), renderC(), renderD(), renderE(), renderF(), renderG(), renderH(), renderI(), renderJ(), renderK(), renderL(), renderM(), renderN(), renderO(), renderFooter()].join('');
    renderModuleList();
    updateGlossCount();
    applyEntitySelection();
    applyPhaseSelection(false);
    drawSwim();
    setupSpy();
    onScroll();
  }

  function setLang(lang, keepPosition) {
    if (lang === S.lang) return;
    let anchor = null, offset = 0;
    if (keepPosition) {
      const secs = $$('.doc-section, .cover');
      anchor = secs.filter((s) => s.getBoundingClientRect().top <= 120).pop() || secs[0];
      offset = anchor ? anchor.getBoundingClientRect().top : 0;
    }
    S.lang = lang;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* storage unavailable */ }
    const id = anchor && anchor.id;
    renderAll();
    if (id) {
      const el = document.getElementById(id);
      if (el) window.scrollTo({ top: window.scrollY + el.getBoundingClientRect().top - offset, behavior: 'instant' });
    }
    const btn = $(`.seg button[data-action="lang"][data-v="${lang}"]`);
    if (btn) btn.focus();
  }

  function scrollIntoViewIfNeeded(el) {
    const r = el.getBoundingClientRect();
    const top = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--topbar-h')) || 60;
    if (r.top < top + 10 || r.top > window.innerHeight * 0.6) {
      window.scrollTo({ top: window.scrollY + r.top - top - 20, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    }
  }

  function toggleModule(id, force) {
    const el = $('#module-' + id);
    if (!el) return;
    const open = force != null ? force : !S.open.has(id);
    if (open) S.open.add(id); else S.open.delete(id);
    el.classList.toggle('is-open', open);
    $('.module-toggle', el).setAttribute('aria-expanded', String(open));
    $('#module-' + id + '-body').hidden = !open;
  }

  function gotoModule(id) {
    const m = MODI[id];
    if (!m) return;
    if (!moduleMatches(m)) { S.modQ = ''; S.modGroup = 'all'; S.modScope = 'all'; const s = $('#module-search'); if (s) s.value = ''; refreshSeg('mod-group', 'all'); refreshSeg('mod-scope', 'all'); applyModuleFilter(); }
    toggleModule(id, true);
    const el = $('#module-' + id);
    history.replaceState(null, '', '#module-' + id);
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    $('.module-toggle', el).focus({ preventScroll: true });
  }
  function refreshSeg(action, v) { $$(`[data-action="${action}"]`).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === v))); }

  function selectWorkflow(id, focus) {
    if (!WFI[id]) return;
    S.wf = id;
    $$('.wf-tab').forEach((t) => { const on = t.dataset.id === id; t.setAttribute('aria-selected', String(on)); t.tabIndex = on ? 0 : -1; });
    $$('.wf-panel').forEach((p) => { p.hidden = p.id !== 'wf-' + id; });
    if (focus) $('#wf-tab-' + id).focus();
  }

  function selectArch(id) {
    if (!ARCI[id]) return;
    S.arch = id;
    $$('.anode').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.id === id)));
    $('#arch-detail').innerHTML = archDetail();
    if (window.innerWidth <= 1180) scrollIntoViewIfNeeded($('#arch-detail'));
  }

  function selectRisk(id) {
    S.risk = S.risk === id ? null : id;
    $$('.hcell button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.id === S.risk)));
    $$('.risk-table tbody tr').forEach((r) => r.classList.toggle('is-hl', r.id === 'risk-' + S.risk));
    $$('.prio-list a').forEach((a) => a.setAttribute('aria-current', String(a.dataset.id === S.risk)));
    if (S.risk) scrollIntoViewIfNeeded($('#risk-' + S.risk));
  }

  function closeMenu() {
    $('#sidenav').classList.remove('open');
    $('#scrim').classList.remove('show');
    const b = $('[data-action="menu"]'); if (b) b.setAttribute('aria-expanded', 'false');
  }

  function handleHash(hash) {
    if (!hash || hash === '#') return false;
    const id = decodeURIComponent(hash.slice(1));
    if (/^module-m\d\d$/.test(id)) { gotoModule(id.slice(7)); return true; }
    if (/^wf-wf\d\d$/.test(id)) { selectWorkflow(id.slice(3)); }
    if (/^phase-p\d\d$/.test(id)) { S.phase = id.slice(6); applyPhaseSelection(false); }
    if (/^dec-D-\d\d$/.test(id) && S.dec !== 'all') { S.dec = 'all'; refreshDecisions(); }
    const el = document.getElementById(id);
    if (el) { el.scrollIntoView({ block: 'start' }); return true; }
    return false;
  }
  function refreshDecisions() {
    $('#dec-body').innerHTML = decRows();
    refreshSeg('dec-filter', S.dec);
  }

  document.addEventListener('click', (ev) => {
    const t = ev.target.closest('[data-action]');
    if (!t) {
      const a = ev.target.closest('a[href^="#"]');
      if (a && $('#sidenav').classList.contains('open')) closeMenu();
      return;
    }
    const act = t.dataset.action, id = t.dataset.id, v = t.dataset.v;
    switch (act) {
      case 'lang': setLang(v, true); break;
      case 'print': window.print(); break;
      case 'menu': {
        const nav = $('#sidenav'); const open = !nav.classList.contains('open');
        nav.classList.toggle('open', open); $('#scrim').classList.toggle('show', open);
        t.setAttribute('aria-expanded', String(open));
        if (open) { const a = $('a[aria-current="true"]', nav) || $('a', nav); if (a) a.focus(); }
        break;
      }
      case 'top': window.scrollTo({ top: 0, behavior: 'smooth' }); $('#main').focus({ preventScroll: true }); break;
      case 'toggle-module': toggleModule(id); break;
      case 'goto-module': ev.preventDefault(); gotoModule(id); break;
      case 'expand-all': D.modules.filter(moduleMatches).forEach((m) => toggleModule(m.id, true)); break;
      case 'collapse-all': D.modules.forEach((m) => toggleModule(m.id, false)); break;
      case 'mod-group': S.modGroup = v; refreshSeg(act, v); applyModuleFilter(); break;
      case 'mod-scope': S.modScope = v; refreshSeg(act, v); applyModuleFilter(); break;
      case 'wf': selectWorkflow(id); break;
      case 'goto-wf': ev.preventDefault(); selectWorkflow(id); history.replaceState(null, '', '#wf-' + id); $('#workflows').scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
      case 'arch': selectArch(id); break;
      case 'toggle-stack': {
        const open = !S.stackOpen.has(id);
        if (open) S.stackOpen.add(id); else S.stackOpen.delete(id);
        const row = $('#stack-' + id); row.classList.toggle('is-open', open);
        t.setAttribute('aria-expanded', String(open)); $('#stack-' + id + '-body').hidden = !open;
        break;
      }
      case 'dec-filter': S.dec = v; refreshDecisions(); break;
      case 'goto-dec': {
        ev.preventDefault();
        if (S.dec !== 'all') { S.dec = 'all'; refreshDecisions(); }
        const target = id ? $('#dec-' + id) : $('#decision-register');
        if (target) { history.replaceState(null, '', id ? '#dec-' + id : '#decision-register'); target.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        break;
      }
      case 'sec-filter': S.secPolicy = v; refreshSeg(act, v); D.security.forEach((s) => { $('#sec-' + s.id).hidden = v === 'policy' && !s.policyDependent; }); break;
      case 'phase': if (id && PHI[id]) { S.phase = id; applyPhaseSelection(t.closest('.phase-nav, .rm-list, .rm-grid') != null); } break;
      case 'goto-phase': ev.preventDefault(); S.phase = id; applyPhaseSelection(false); history.replaceState(null, '', '#phase-' + id); $('#phase-' + id).scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
      case 'risk': ev.preventDefault(); selectRisk(id); break;
      default: break;
    }
  });

  document.addEventListener('input', (ev) => {
    if (ev.target.id === 'module-search') { S.modQ = ev.target.value; applyModuleFilter(); }
    if (ev.target.id === 'gloss-search') { S.glossQ = ev.target.value; $('#gloss-body').innerHTML = glossRows(); updateGlossCount(); }
  });

  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && $('#sidenav').classList.contains('open')) { closeMenu(); const b = $('[data-action="menu"]'); if (b) b.focus(); return; }
    const tab = ev.target.closest && ev.target.closest('.wf-tab');
    if (tab) {
      const ids = D.workflows.map((w) => w.id);
      let i = ids.indexOf(tab.dataset.id);
      const fwd = ['ArrowDown', isRtl() ? 'ArrowLeft' : 'ArrowRight'], back = ['ArrowUp', isRtl() ? 'ArrowRight' : 'ArrowLeft'];
      if (fwd.includes(ev.key)) i = (i + 1) % ids.length;
      else if (back.includes(ev.key)) i = (i - 1 + ids.length) % ids.length;
      else if (ev.key === 'Home') i = 0;
      else if (ev.key === 'End') i = ids.length - 1;
      else return;
      ev.preventDefault();
      selectWorkflow(ids[i], true);
      return;
    }
    const ent = ev.target.closest && ev.target.closest('.er-ent');
    if (ent && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); S.entity = S.entity === ent.dataset.ent ? null : ent.dataset.ent; applyEntitySelection(); }
  });
  document.addEventListener('click', (ev) => {
    const ent = ev.target.closest && ev.target.closest('.er-ent');
    if (ent) { S.entity = S.entity === ent.dataset.ent ? null : ent.dataset.ent; applyEntitySelection(); }
  });
  $('#scrim').addEventListener('click', closeMenu);

  /* ---------- scroll spy & progress ---------- */
  let spy = null;
  function setupSpy() {
    if (spy) spy.disconnect();
    const links = byId($$('.nav-list a').map((a) => ({ id: a.dataset.sec, a })));
    const visible = new Map();
    spy = new IntersectionObserver((entries) => {
      entries.forEach((e) => visible.set(e.target.dataset.sec, e.isIntersecting));
      const order = D.sections.map((s) => s.id);
      let cur = order.find((k) => visible.get(k));
      if (!cur) return;
      Object.values(links).forEach((l) => l.a.removeAttribute('aria-current'));
      if (links[cur]) links[cur].a.setAttribute('aria-current', 'true');
      const idx = order.indexOf(cur) + 1;
      const pos = $('#nav-pos'); if (pos) pos.textContent = ui('sectionOf').replace('{n}', idx).replace('{t}', order.length);
      const bar = $('#nav-bar'); if (bar) bar.style.width = (idx / order.length * 100) + '%';
    }, { rootMargin: '-25% 0px -65% 0px' });
    $$('.doc-section').forEach((s) => spy.observe(s));
  }
  function onScroll() {
    const h = document.documentElement;
    const max = h.scrollHeight - h.clientHeight;
    const pct = max > 0 ? Math.min(100, (h.scrollTop / max) * 100) : 0;
    $('#progress-bar').style.width = pct + '%';
    $('#to-top').classList.toggle('show', h.scrollTop > 900);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  let rz = null;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { drawRoadmap(); drawSwim(); if (window.innerWidth > 1180) closeMenu(); }, 120); });
  window.addEventListener('hashchange', () => handleHash(location.hash));
  window.addEventListener('beforeprint', () => { $$('.module-body, .srow-body').forEach((b) => b.setAttribute('data-print', '1')); });

  /* ---------- boot ---------- */
  function initialLang() {
    const p = new URLSearchParams(location.search).get('lang');
    if (p === 'ar' || p === 'en') return p;
    try { const s = localStorage.getItem(LANG_KEY); if (s === 'ar' || s === 'en') return s; } catch (e) { /* storage unavailable */ }
    return 'en';
  }
  injectSprite();
  S.lang = initialLang();
  renderAll();
  if (location.hash) setTimeout(() => handleHash(location.hash), 30);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { drawRoadmap(); drawSwim(); });
  window.CAFM_BLUEPRINT = { state: S, setLang: (l) => setLang(l, false) };
})();
</script>
</body>
</html>
